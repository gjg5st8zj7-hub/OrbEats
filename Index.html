<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OrbEats" />
  <title>OrbEats</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --good:#7cffb2; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:#0b1020; font-family:Nunito,sans-serif; color:#e8f0ff; touch-action:none; user-select:none; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    #hud { position:fixed; top:10px; left:10px; pointer-events:none; font-weight:800; text-shadow:0 1px 4px #000; }
    #leaderboard { position:fixed; top:10px; right:10px; background:rgba(8,12,24,.72); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:8px 10px; min-width:140px; font-size:13px; }
    #leaderboard ol { margin:0; padding:0; list-style:none; }
    #leaderboard li { display:flex; justify-content:space-between; gap:10px; }
    #leaderboard li.me { color:var(--good); font-weight:800; }
    #leaderboard li.youRow { margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.12); }
    #controls { position:fixed; left:0; right:0; bottom:0; height:210px; pointer-events:none; }
    #joyWrap { position:absolute; left:28px; bottom:28px; width:116px; height:116px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); pointer-events:auto; }
    #joyKnob { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(110,231,255,.85); }
    #acts { position:absolute; right:22px; bottom:36px; display:flex; flex-direction:column; gap:12px; pointer-events:auto; }
    .act { width:64px; height:64px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(8,14,28,.55); color:#fff; font-weight:800; }
    #exitBtn { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:5; font:800 12px Nunito; background:rgba(8,12,24,.7); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 12px; display:none; }
    #menu, #dead { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
      background: radial-gradient(900px 500px at 20% 20%, rgba(110,231,255,.18), transparent 50%),
        radial-gradient(800px 500px at 80% 80%, rgba(255,107,203,.16), transparent 50%), #0b1020; }
    #dead { display:none; }
    #dead.show { display:flex; }
    #menu.hidden { display:none; }
    .card { width:min(520px, calc(100vw - 28px)); max-height:min(92vh, 860px); overflow:auto;
      background:rgba(12,18,36,.78); border:1px solid rgba(255,255,255,.1); border-radius:22px;
      padding:24px 20px 18px; backdrop-filter:blur(16px); box-shadow:0 30px 80px rgba(0,0,0,.45); text-align:center; }
    .logo { font-weight:900; font-size:42px; letter-spacing:.06em; background:linear-gradient(90deg,#6ee7ff,#ff6bcb); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .tag { opacity:.7; margin:6px 0 14px; }
    input { width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:#0c1220; color:#fff; font:800 16px Nunito; }
    .play { margin-top:14px; width:100%; padding:14px; border:0; border-radius:14px; background:linear-gradient(90deg,#6ee7ff,#7cffb2); color:#041018; font:900 16px Nunito; }
    .skinHead { margin:16px 0 8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; text-align:left; }
    #skinGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:7px; }
    .skinBtn { background:#121a2e; border:2px solid rgba(255,255,255,.12); border-radius:12px; color:#d7e4ff; padding:4px 2px 3px; font-size:10px; }
    .skinBtn.on { border-color:#6ee7ff; }
    .skinBtn canvas { width:46px; height:46px; display:block; margin:0 auto; }
    .hint { margin-top:10px; font-size:12px; opacity:.65; text-align:left; }
    kbd { background:#000; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div id="scoreVal">0</div><div id="massVal">Mass 0</div></div>
  <div id="leaderboard"><ol id="lbList"></ol></div>
  <button type="button" id="exitBtn">EXIT</button>
  <div id="controls">
    <div id="joyWrap"><div id="joyKnob"></div></div>
    <div id="acts">
      <button type="button" class="act" id="splitBtn">SPLIT</button>
      <button type="button" class="act" id="feedBtn">FEED</button>
    </div>
  </div>
  <div id="menu">
    <div class="card">
      <div class="logo">OrbEats</div>
      <div class="tag">Eat. Grow. Dominate.</div>
      <input id="nameInput" maxlength="16" placeholder="Your name" />
      <div class="skinHead">Skin — skip for a random color</div>
      <div id="skinGrid"></div>
      <button type="button" class="play" id="playBtn">PLAY</button>
      <div class="hint">Left stick steers. Right buttons split / feed.<br>Desktop: mouse, <kbd>Space</kbd> split, <kbd>W</kbd> feed.</div>
    </div>
  </div>
  <div id="dead">
    <div class="card">
      <div class="logo" style="font-size:28px">Eaten</div>
      <div class="tag" id="deadMsg">A larger cell absorbed you.</div>
      <button class="play" id="againBtn">PLAY AGAIN</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const socket = io({ transports: ['websocket', 'polling'] });
    const SKINS = [
      'chrome','glass','mangrove','surge','manatee','dawn','rust','copper','drydock','flame','bilge','weld','tarpon','cuda','shark','lionfish','gator','osprey','blackwater','nebula','comet','eclipse','phosphor','venom','jaw','lava','hotsauce','cotton','king','ghost','pearl','trophy','ice','coral','plasma','honey','midnight','magma'
    ];
    const NAMES = { chrome:'Chrome', glass:'Glass', mangrove:'Mangrove', surge:'Surge', manatee:'Manatee', dawn:'Dawn', rust:'Rust', copper:'Copper', drydock:'Drydock', flame:'Flame', bilge:'Bilge', weld:'Weld', tarpon:'Tarpon', cuda:'Cuda', shark:'Shark', lionfish:'Lionfish', gator:'Gator', osprey:'Osprey', blackwater:'Blackwater', nebula:'Nebula', comet:'Comet', eclipse:'Eclipse', phosphor:'Phosphor', venom:'Venom', jaw:'Jawbreaker', lava:'Lava', hotsauce:'Hot Sauce', cotton:'Cotton', king:'King Tide', ghost:'Ghost', pearl:'Void Pearl', trophy:'Trophy', ice:'Pack Ice', coral:'Coral', plasma:'Plasma', honey:'Honeycomb', midnight:'Midnight', magma:'Magma' };
    let chosenSkin = '';
    try { chosenSkin = localStorage.getItem('blobarena_skin') || ''; } catch (_) {}

    const skinCache = new Map();
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function paintSkin(g, x, y, r, id, color) {
      g.save(); g.beginPath(); g.arc(x, y, Math.max(1, r), 0, Math.PI * 2); g.clip();
      const rad = (a, b, c) => {
        const gr = g.createRadialGradient(x - r * 0.32, y - r * 0.34, r * 0.06, x, y, r);
        gr.addColorStop(0, a); gr.addColorStop(0.55, b); gr.addColorStop(1, c);
        g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
      };
      const map = {
        chrome:['#f4ffff','#4ad0d8','#0b3a4a'], glass:['#e8fffb','#5ee0d0','#0e6a78'], mangrove:['#3d7a48','#16341c','#061008'],
        surge:['#7eb4d8','#1c3c5c','#071018'], rust:['#e08a48','#8a3a18','#2a1008'], copper:['#ffd0a0','#c46a28','#5a2810'],
        gator:['#8a9a48','#3a4a20','#14180c'], eclipse:['#141414','#050505','#000'], phosphor:['#1a4860','#0a1824','#03080c'],
        venom:['#e8ff6a','#7aaa10','#2a3a08'], king:['#fff3b0','#e0b020','#7a5a08'], ghost:null, lava:['#ffd060','#ff4a10','#3a0810'],
        nebula:['#f0c8ff','#6a30a0','#160428'], magma:['#ffcc66','#c02808','#2a0608']
      };
      if (!id) rad(shade(color, 50), color, shade(color, -40));
      else if (id === 'ghost') { g.fillStyle = 'rgba(170,210,240,0.16)'; g.fillRect(x-r,y-r,r*2,r*2); }
      else { const m = map[id] || [shade(color,40), color, shade(color,-40)]; rad(m[0], m[1], m[2]); }
      const h = g.createRadialGradient(x - r*0.28, y - r*0.32, 0, x - r*0.28, y - r*0.32, r*0.55);
      h.addColorStop(0, 'rgba(255,255,255,0.42)'); h.addColorStop(1, 'rgba(255,255,255,0)');
      if (id !== 'ghost') { g.fillStyle = h; g.fillRect(x-r,y-r,r*2,r*2); }
      g.restore();
    }
    function bakeSkin(id, color) {
      const key = (id || 'plain') + ':' + (color || '');
      let c = skinCache.get(key);
      if (c) return c;
      c = document.createElement('canvas'); c.width = 256; c.height = 256;
      paintSkin(c.getContext('2d'), 128, 128, 126, id, color);
      skinCache.set(key, c); return c;
    }

    const grid = document.getElementById('skinGrid');
    SKINS.forEach(id => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'skinBtn' + (chosenSkin === id ? ' on' : '');
      b.innerHTML = '<canvas width="46" height="46"></canvas><div>' + (NAMES[id] || id) + '</div>';
      paintSkin(b.querySelector('canvas').getContext('2d'), 23, 23, 21, id, '#4ad0ff');
      b.onclick = () => {
        chosenSkin = chosenSkin === id ? '' : id;
        try { localStorage.setItem('blobarena_skin', chosenSkin); } catch (_) {}
        [...grid.children].forEach(x => x.classList.toggle('on', x === b && chosenSkin));
      };
      grid.appendChild(b);
    });

    let W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() {
      W = innerWidth; H = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();

    let WORLD = 10000, state = null, myId = null, running = false;
    let cam = { x: 5000, y: 5000, z: 1 };
    let face = { x: 1, y: 0 };
    let stick = { active: false, id: null, kx: 0, ky: 0 };
    let feeding = false;
    const JOY = 58;

    socket.on('state', s => { state = s; WORLD = s.world || WORLD; });
    socket.on('joined', d => { myId = d.id; running = true; document.getElementById('menu').classList.add('hidden'); document.getElementById('dead').classList.remove('show'); document.getElementById('exitBtn').style.display = 'block'; });
    socket.on('dead', d => {
      running = false;
      document.getElementById('deadMsg').textContent = (d && d.by ? d.by : 'Someone') + ' absorbed you.';
      document.getElementById('dead').classList.add('show');
      document.getElementById('exitBtn').style.display = 'none';
    });

    function play() {
      const name = document.getElementById('nameInput').value.trim() || 'Unnamed';
      socket.emit('join', { name, skin: chosenSkin });
    }
    document.getElementById('playBtn').onclick = play;
    document.getElementById('againBtn').onclick = play;
    document.getElementById('exitBtn').onclick = () => {
      socket.emit('exit'); running = false;
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('dead').classList.remove('show');
      document.getElementById('exitBtn').style.display = 'none';
    };
    document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') play(); });

    function sendInput(extra) {
      socket.emit('input', Object.assign({ x: face.x, y: face.y }, extra || {}));
    }
    setInterval(() => { if (running) sendInput(feeding ? { feed: true } : {}); }, 50);

    function worldToScreen(x, y) { return { x: (x - cam.x) * cam.z + W / 2, y: (y - cam.y) * cam.z + H / 2 }; }
    function draw() {
      ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, H);
      if (!state) return;
      const me = (state.players || []).find(p => p.id === state.you);
      if (me && me.cells.length) {
        let m = 0, x = 0, y = 0;
        for (const c of me.cells) { x += c.x * c.mass; y += c.y * c.mass; m += c.mass; }
        cam.x += (x / m - cam.x) * 0.18; cam.y += (y / m - cam.y) * 0.18;
        const desiredZ = Math.max(0.16, Math.min(1.15, 1.12 - Math.sqrt(m) * 0.018 - (me.cells.length - 1) * 0.035));
        cam.z += (desiredZ - cam.z) * 0.06;
        document.getElementById('scoreVal').textContent = (state.score || 0).toLocaleString();
        document.getElementById('massVal').textContent = 'Mass ' + (state.mass || 0);
      }
      const step = cam.z < 0.4 ? 180 : 60;
      ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.beginPath();
      const sx0 = cam.x - W / 2 / cam.z, sy0 = cam.y - H / 2 / cam.z, sx1 = cam.x + W / 2 / cam.z, sy1 = cam.y + H / 2 / cam.z;
      for (let x = Math.floor(sx0 / step) * step; x < sx1; x += step) { const s = worldToScreen(x, 0); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, H); }
      for (let y = Math.floor(sy0 / step) * step; y < sy1; y += step) { const s = worldToScreen(0, y); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); }
      ctx.stroke();
      const a = worldToScreen(0, 0), b = worldToScreen(WORLD, WORLD);
      ctx.strokeStyle = 'rgba(110,231,255,0.35)'; ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      for (const f of state.foods || []) {
        const s = worldToScreen(f.x, f.y); const r = f.r * cam.z;
        if (s.x < -10 || s.y < -10 || s.x > W + 10 || s.y > H + 10) continue;
        ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(2.2, r), 0, Math.PI * 2); ctx.fillStyle = f.color; ctx.fill();
      }
      const layers = [];
      for (const v of state.viruses || []) layers.push({ kind:'v', mass:100, v });
      for (const p of state.players || []) for (const c of p.cells) layers.push({ kind:'c', mass:c.mass, c, p });
      layers.sort((x, y) => x.mass - y.mass);
      for (const item of layers) {
        if (item.kind === 'v') {
          const v = item.v, s = worldToScreen(v.x, v.y), r = v.r * cam.z;
          if (s.x < -r || s.y < -r || s.x > W + r || s.y > H + r) continue;
          ctx.beginPath();
          for (let i = 0; i < (v.spikes || 14); i++) {
            const ang = (i / (v.spikes || 14)) * Math.PI * 2;
            const rr = i % 2 === 0 ? r * 1.18 : r * 0.82;
            i === 0 ? ctx.moveTo(s.x + Math.cos(ang)*rr, s.y + Math.sin(ang)*rr) : ctx.lineTo(s.x + Math.cos(ang)*rr, s.y + Math.sin(ang)*rr);
          }
          ctx.closePath(); ctx.fillStyle = '#7cff6a'; ctx.fill(); ctx.strokeStyle = '#1f7a28'; ctx.stroke();
        } else {
          const c = item.c, p = item.p, s = worldToScreen(c.x, c.y), r = c.r * cam.z;
          if (s.x < -r || s.y < -r || s.x > W + r || s.y > H + r) continue;
          ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          if (r >= 8) {
            ctx.save(); ctx.clip();
            ctx.drawImage(bakeSkin(p.skin, p.color), s.x - r, s.y - r, r * 2, r * 2);
            ctx.restore();
          } else { ctx.fillStyle = p.color; ctx.fill(); }
          ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.lineWidth = Math.max(1.5, Math.min(6, r * 0.05));
          ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.stroke();
          if (p.name && r >= 7) {
            const fs = Math.min(22, r * 0.46);
            ctx.font = '800 ' + fs + 'px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(p.name, s.x, s.y);
            ctx.fillStyle = '#fff'; ctx.fillText(p.name, s.x, s.y);
          }
        }
      }
      document.getElementById('lbList').innerHTML = (state.lb || []).map(r =>
        '<li class="' + (r.me ? 'me' : '') + (r.i > 8 ? ' youRow' : '') + '"><span>' + r.i + '. ' + r.name + '</span><span>' + r.mass + '</span></li>'
      ).join('');
    }
    function loop() { draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    const joyWrap = document.getElementById('joyWrap');
    const joyKnob = document.getElementById('joyKnob');
    function joyCenter() { const r = joyWrap.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }
    function applyStick(cx, cy) {
      const c = joyCenter(); let dx = cx - c.x, dy = cy - c.y;
      const len = Math.hypot(dx, dy) || 1; const cap = Math.min(len, JOY);
      dx = dx / len * cap; dy = dy / len * cap;
      stick.kx = dx; stick.ky = dy; face.x = dx / JOY; face.y = dy / JOY;
      joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    }
    joyWrap.addEventListener('pointerdown', e => { stick.active = true; stick.id = e.pointerId; joyWrap.setPointerCapture(e.pointerId); applyStick(e.clientX, e.clientY); });
    joyWrap.addEventListener('pointermove', e => { if (stick.active && e.pointerId === stick.id) applyStick(e.clientX, e.clientY); });
    function endStick() { stick.active = false; stick.id = null; joyKnob.style.transform = ''; }
    joyWrap.addEventListener('pointerup', endStick);
    joyWrap.addEventListener('pointercancel', endStick);
    document.getElementById('splitBtn').addEventListener('pointerdown', e => { e.preventDefault(); sendInput({ split: true }); });
    document.getElementById('feedBtn').addEventListener('pointerdown', e => { e.preventDefault(); feeding = true; sendInput({ feed: true }); });
    document.getElementById('feedBtn').addEventListener('pointerup', () => { feeding = false; });
    addEventListener('mousemove', e => { if (!stick.active) { face.x = e.clientX - W/2; face.y = e.clientY - H/2; const l = Math.hypot(face.x, face.y) || 1; face.x /= l; face.y /= l; } });
    addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); sendInput({ split: true }); }
      if (e.code === 'KeyW') feeding = true;
    });
    addEventListener('keyup', e => { if (e.code === 'KeyW') feeding = false; });
  })();
  </script>
</body>
</html>
