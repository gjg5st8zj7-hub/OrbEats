<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OrbEats" />
  <title>OrbEats</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --good:#7cffb2; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:#0b1020; font-family:Nunito,sans-serif; color:#e8f0ff; touch-action:none; user-select:none; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    #hud { position:fixed; top:10px; left:10px; pointer-events:none; font-weight:800; text-shadow:0 1px 4px #000; }
    #leaderboard { position:fixed; top:10px; right:10px; background:rgba(8,12,24,.72); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:8px 10px; min-width:140px; font-size:13px; }
    #leaderboard ol { margin:0; padding:0; list-style:none; }
    #leaderboard li { display:flex; justify-content:space-between; gap:10px; }
    #leaderboard li.me { color:var(--good); font-weight:800; }
    #leaderboard li.youRow { margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.12); }
    #controls { position:fixed; left:0; right:0; bottom:0; height:210px; pointer-events:none; }
    #joyWrap { position:absolute; left:max(10px, env(safe-area-inset-left)); bottom:max(18px, env(safe-area-inset-bottom)); width:168px; height:168px; pointer-events:auto; border-radius:50%; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.16); box-shadow:inset 0 0 24px rgba(0,0,0,.25); }
    #joyKnob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:rgba(126,232,255,.28); border:2px solid rgba(255,255,255,.38); }
    #acts { position:absolute; right:16px; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:14px; pointer-events:auto; }
    .act { width:78px; height:78px; border-radius:50%; border:1.5px solid rgba(255,255,255,.22); background:rgba(12,18,36,.28); color:rgba(255,255,255,.82); font:800 12px Nunito,sans-serif; letter-spacing:.08em; }
    #splitBtn { width:88px; height:88px; font-size:13px; }
    #lbToggle { pointer-events:auto; position:fixed; top:12px; right:14px; width:36px; height:22px; z-index:8; border:1px solid rgba(255,255,255,.16); background:rgba(10,16,32,.72); color:rgba(255,255,255,.8); border-radius:0 0 10px 10px; font:800 11px Nunito,sans-serif; }
    #leaderboard.closed { display:none; }
    #exitBtn { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:5; font:800 12px Nunito; background:rgba(8,12,24,.7); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 12px; display:none; }
    #menu, #dead { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
      background: radial-gradient(900px 500px at 20% 20%, rgba(110,231,255,.18), transparent 50%),
        radial-gradient(800px 500px at 80% 80%, rgba(255,107,203,.16), transparent 50%), #0b1020; }
    #dead { display:none; }
    #dead.show { display:flex; }
    #menu.hidden { display:none; }
    .card { width:min(520px, calc(100vw - 28px)); max-height:min(92vh, 860px); overflow:auto;
      background:rgba(12,18,36,.78); border:1px solid rgba(255,255,255,.1); border-radius:22px;
      padding:24px 20px 18px; backdrop-filter:blur(16px); box-shadow:0 30px 80px rgba(0,0,0,.45); text-align:center; }
    .logo { font-weight:900; font-size:42px; letter-spacing:.06em; background:linear-gradient(90deg,#6ee7ff,#ff6bcb); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .tag { opacity:.7; margin:6px 0 14px; }
    input { width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:#0c1220; color:#fff; font:800 16px Nunito; }
    .play { margin-top:14px; width:100%; padding:14px; border:0; border-radius:14px; background:linear-gradient(90deg,#6ee7ff,#7cffb2); color:#041018; font:900 16px Nunito; }
    .skinHead { margin:16px 0 8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; text-align:left; }
    #skinGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:7px; }
    .skinBtn { background:#121a2e; border:2px solid rgba(255,255,255,.12); border-radius:12px; color:#d7e4ff; padding:4px 2px 3px; font-size:10px; }
    .skinBtn.on { border-color:#6ee7ff; }
    .skinBtn canvas { width:46px; height:46px; display:block; margin:0 auto; }
    .hint { margin-top:10px; font-size:12px; opacity:.65; text-align:left; }
    kbd { background:#000; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div id="scoreVal">0</div><div id="massVal">Mass 0</div></div>
  <button type="button" id="lbToggle" aria-label="Toggle board">▲</button>
  <div id="leaderboard"><ol id="lbList"></ol></div>
  <button type="button" id="exitBtn">EXIT</button>
  <div id="controls">
    <div id="joyWrap"><div id="joyKnob"></div></div>
    <div id="acts">
      <button type="button" class="act" id="feedBtn">FEED</button>
      <button type="button" class="act" id="splitBtn">SPLIT</button>
    </div>
  </div>
  <div id="menu">
    <div class="card">
      <div class="logo">OrbEats</div>
      <div class="tag">Eat. Grow. Dominate.</div>
      <input id="nameInput" maxlength="16" placeholder="Your name" />
      <div class="skinHead">Skin — skip for a random color</div>
      <div id="skinGrid"></div>
      <button type="button" class="play" id="playBtn" onclick="window.__play&&window.__play()">PLAY</button>
      <div class="hint">Left stick steers. Right buttons split / feed.<br>Desktop: mouse, <kbd>Space</kbd> split, <kbd>W</kbd> feed.</div>
    </div>
  </div>
  <div id="dead">
    <div class="card">
      <div class="logo" style="font-size:28px">Eaten</div>
      <div class="tag" id="deadMsg">A larger cell absorbed you.</div>
      <button class="play" id="againBtn">PLAY AGAIN</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>if(typeof io==="undefined"){document.write('<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"><\/script>')}</script>
  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    if (typeof io === 'undefined') {
      const b = document.getElementById('playBtn');
      if (b) { b.textContent = 'NO SERVER'; }
      alert('Game page loaded but Socket.IO did not. Check Railway is Online and you opened the railway.app link.');
      return;
    }
    const socket = io({ transports: ['websocket', 'polling'], reconnection: true, reconnectionAttempts: 8 });
    let joinPending = false;
    socket.on('connect', () => { console.log('socket ok'); if (joinPending) { joinPending = false; doJoin(); } });
    socket.on('connect_error', (e) => { console.warn(e); const el = document.getElementById('playBtn'); if (el) el.textContent = 'RETRY'; });
    const SKINS = [
      'chrome','glass','mangrove','surge','manatee','dawn','rust','copper','drydock','flame','bilge','weld','tarpon','cuda','shark','lionfish','gator','osprey','blackwater','nebula','comet','eclipse','phosphor','venom','jaw','lava','hotsauce','cotton','king','ghost','pearl','trophy','ice','coral','plasma','honey','midnight','magma'
    ];
    const NAMES = { chrome:'Chrome', glass:'Glass', mangrove:'Mangrove', surge:'Surge', manatee:'Manatee', dawn:'Dawn', rust:'Rust', copper:'Copper', drydock:'Drydock', flame:'Flame', bilge:'Bilge', weld:'Weld', tarpon:'Tarpon', cuda:'Cuda', shark:'Shark', lionfish:'Lionfish', gator:'Gator', osprey:'Osprey', blackwater:'Blackwater', nebula:'Nebula', comet:'Comet', eclipse:'Eclipse', phosphor:'Phosphor', venom:'Venom', jaw:'Jawbreaker', lava:'Lava', hotsauce:'Hot Sauce', cotton:'Cotton', king:'King Tide', ghost:'Ghost', pearl:'Void Pearl', trophy:'Trophy', ice:'Pack Ice', coral:'Coral', plasma:'Plasma', honey:'Honeycomb', midnight:'Midnight', magma:'Magma' };
    let chosenSkin = '';
    try { chosenSkin = localStorage.getItem('blobarena_skin') || ''; } catch (_) {}

    const skinCache = new Map();
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
      r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function hashHue(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
      return Math.abs(h);
    }
    function paintSkin(g, x, y, r, id, color) {
      g.save();
      g.beginPath();
      g.arc(x, y, Math.max(1, r), 0, Math.PI * 2);
      g.clip();
      const seed = hashHue(id || color || 'x');
      const rnd = (n) => {
        const v = Math.sin(seed * 0.001 + n * 12.9898) * 43758.5453;
        return v - Math.floor(v);
      };
      const rad = (c0, c1, c2) => {
        const gr = g.createRadialGradient(x - r * 0.32, y - r * 0.34, r * 0.06, x, y, r);
        gr.addColorStop(0, c0);
        gr.addColorStop(0.55, c1);
        gr.addColorStop(1, c2);
        g.fillStyle = gr;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      };
      const specks = (n, col, size) => {
        g.fillStyle = col;
        for (let i = 0; i < n; i++) {
          const a = rnd(i) * Math.PI * 2;
          const d = Math.sqrt(rnd(i + 40)) * r * 0.92;
          g.beginPath();
          g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.max(0.6, r * size * (0.4 + rnd(i + 80))), 0, Math.PI * 2);
          g.fill();
        }
      };
      const scales = (col, step) => {
        g.strokeStyle = col;
        g.lineWidth = Math.max(0.8, r * 0.018);
        const st = r * step;
        for (let row = -r; row < r; row += st) {
          const odd = Math.floor((row + r) / st) % 2;
          for (let colx = -r; colx < r; colx += st) {
            g.beginPath();
            g.arc(x + colx + (odd ? st * 0.5 : 0), y + row + st * 0.55, st * 0.48, Math.PI, 0);
            g.stroke();
          }
        }
      };
      const gloss = () => {
        const h = g.createRadialGradient(x - r * 0.28, y - r * 0.32, 0, x - r * 0.28, y - r * 0.32, r * 0.55);
        h.addColorStop(0, 'rgba(255,255,255,0.42)');
        h.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = h;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      };
      if (!id) {
        rad(shade(color, 50), color, shade(color, -40));
        gloss();
        g.restore();
        return;
      }
      if (id === 'chrome') { rad('#f4ffff', '#4ad0d8', '#0b3a4a'); specks(18, 'rgba(255,255,255,0.35)', 0.03); }
      else if (id === 'glass') { rad('#e8fffb', '#5ee0d0', '#0e6a78'); }
      else if (id === 'mangrove') { rad('#3d7a48', '#16341c', '#061008'); specks(22, 'rgba(180,255,140,0.28)', 0.025); }
      else if (id === 'surge') { rad('#7eb4d8', '#1c3c5c', '#071018'); specks(30, 'rgba(230,245,255,0.55)', 0.02); }
      else if (id === 'manatee') { rad('#c5ced4', '#7b868e', '#3a4248'); specks(16, 'rgba(255,255,255,0.18)', 0.03); }
      else if (id === 'dawn') { rad('#ffe2c0', '#ff9a7a', '#c45a6a'); }
      else if (id === 'rust') { rad('#e08a48', '#8a3a18', '#2a1008'); specks(28, 'rgba(40,16,8,0.45)', 0.04); scales('rgba(60,20,8,0.35)', 0.16); }
      else if (id === 'copper') { rad('#ffd0a0', '#c46a28', '#5a2810'); scales('rgba(255,210,150,0.28)', 0.14); }
      else if (id === 'drydock') { rad('#ddd8cc', '#8a867c', '#3e3c38'); specks(20, 'rgba(0,0,0,0.15)', 0.02); }
      else if (id === 'flame') { rad('#ffe08a', '#ff6a20', '#7a1208'); specks(16, 'rgba(255,240,160,0.4)', 0.03); }
      else if (id === 'bilge') { rad('#2a2430', '#0c0c12', '#050508'); specks(12, 'rgba(120,255,210,0.22)', 0.04); specks(10, 'rgba(200,80,220,0.2)', 0.035); }
      else if (id === 'weld') { rad('#d0d6dc', '#6a727a', '#2a3036'); }
      else if (id === 'tarpon') { rad('#e8f4f6', '#8aaab4', '#3a545c'); scales('rgba(255,255,255,0.35)', 0.13); }
      else if (id === 'cuda') { rad('#c6e89a', '#4a7a32', '#1a3010'); }
      else if (id === 'shark') { rad('#f2f6f8', '#8a949c', '#3a444c'); }
      else if (id === 'lionfish') { rad('#ffd080', '#e07020', '#6a1808'); }
      else if (id === 'gator') { rad('#8a9a48', '#3a4a20', '#14180c'); scales('rgba(20,30,8,0.45)', 0.18); }
      else if (id === 'osprey') { rad('#ffe08a', '#c48a18', '#2a1808'); }
      else if (id === 'blackwater') { rad('#1c222c', '#0a0c12', '#020204'); }
      else if (id === 'nebula') { rad('#f0c8ff', '#6a30a0', '#160428'); specks(26, 'rgba(255,240,255,0.8)', 0.018); }
      else if (id === 'comet') { rad('#ffffff', '#9ee0ff', '#1a5a88'); specks(18, 'rgba(255,255,255,0.7)', 0.02); }
      else if (id === 'eclipse') { rad('#141414', '#050505', '#000'); }
      else if (id === 'phosphor') { rad('#1a4860', '#0a1824', '#03080c'); specks(34, 'rgba(80,255,230,0.75)', 0.016); }
      else if (id === 'venom') { rad('#e8ff6a', '#7aaa10', '#2a3a08'); specks(18, 'rgba(20,30,0,0.35)', 0.03); }
      else if (id === 'jaw') { rad('#ffd0f0', '#ff4ec8', '#4ad0ff'); }
      else if (id === 'lava') { rad('#ffd060', '#ff4a10', '#3a0810'); specks(14, 'rgba(255,220,80,0.45)', 0.05); }
      else if (id === 'hotsauce') { rad('#ff8a60', '#d01810', '#4a0604'); specks(12, 'rgba(255,200,120,0.3)', 0.04); }
      else if (id === 'cotton') { rad('#ffe0f4', '#ff7ac8', '#c04090'); specks(20, 'rgba(255,255,255,0.45)', 0.04); }
      else if (id === 'king') { rad('#fff3b0', '#e0b020', '#7a5a08'); specks(10, 'rgba(255,255,220,0.5)', 0.03); }
      else if (id === 'ghost') { g.fillStyle = 'rgba(170,210,240,0.16)'; g.fillRect(x - r, y - r, r * 2, r * 2); }
      else if (id === 'pearl') { rad('#2a1840', '#0c0818', '#030208'); }
      else if (id === 'trophy') { rad('#fff4a8', '#e0b010', '#6a4a08'); }
      else if (id === 'ice') { rad('#f4fbff', '#8ec8e8', '#1a4a68'); specks(16, 'rgba(255,255,255,0.55)', 0.025); }
      else if (id === 'coral') { rad('#ffb0a0', '#e05060', '#6a1830'); specks(18, 'rgba(255,230,220,0.35)', 0.03); }
      else if (id === 'plasma') { rad('#e8d0ff', '#6a40ff', '#140838'); specks(20, 'rgba(180,255,255,0.45)', 0.022); }
      else if (id === 'honey') { rad('#ffe08a', '#d09018', '#6a4010'); scales('rgba(80,40,0,0.28)', 0.2); }
      else if (id === 'midnight') { rad('#203060', '#0a1020', '#02040a'); specks(16, 'rgba(160,190,255,0.35)', 0.015); }
      else if (id === 'magma') { rad('#ffcc66', '#c02808', '#2a0608'); specks(18, 'rgba(255,80,0,0.4)', 0.04); }
      else { rad(shade(color, 40), color, shade(color, -40)); }

      if (id === 'cuda' || id === 'lionfish' || id === 'shark') {
        g.strokeStyle = id === 'shark' ? 'rgba(255,255,255,0.18)' : 'rgba(20,20,10,0.28)';
        g.lineWidth = Math.max(1, r * 0.045);
        for (let i = -4; i <= 4; i++) {
          g.beginPath();
          g.moveTo(x - r, y + i * r * 0.18);
          g.lineTo(x + r, y + i * r * 0.18);
          g.stroke();
        }
      }
      if (id === 'eclipse') {
        const halo = g.createRadialGradient(x, y, r * 0.62, x, y, r);
        halo.addColorStop(0, 'rgba(0,0,0,0)');
        halo.addColorStop(0.7, 'rgba(255,160,20,0.15)');
        halo.addColorStop(1, 'rgba(255,190,50,0.9)');
        g.fillStyle = halo;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      if (id === 'surge') {
        g.strokeStyle = 'rgba(240,250,255,0.55)';
        g.lineWidth = Math.max(2, r * 0.07);
        g.beginPath(); g.arc(x, y, r * 0.88, 0, Math.PI * 2); g.stroke();
        g.strokeStyle = 'rgba(200,230,255,0.25)';
        g.lineWidth = Math.max(1, r * 0.03);
        g.beginPath(); g.arc(x, y, r * 0.72, 0.2, 2.2); g.stroke();
      }
      if (id === 'osprey') {
        g.fillStyle = '#140c06';
        g.beginPath(); g.arc(x + r * 0.06, y, r * 0.3, 0, Math.PI * 2); g.fill();
        const eye = g.createRadialGradient(x + r * 0.02, y - r * 0.04, r * 0.02, x + r * 0.06, y, r * 0.18);
        eye.addColorStop(0, '#fff3c0'); eye.addColorStop(0.45, '#f0b020'); eye.addColorStop(1, '#3a2008');
        g.fillStyle = eye;
        g.beginPath(); g.arc(x + r * 0.06, y, r * 0.18, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#0a0604';
        g.beginPath(); g.arc(x + r * 0.1, y, r * 0.07, 0, Math.PI * 2); g.fill();
      }
      if (id === 'pearl') {
        const gem = g.createRadialGradient(x + r * 0.18, y - r * 0.2, 0, x + r * 0.18, y - r * 0.2, r * 0.16);
        gem.addColorStop(0, '#ffffff'); gem.addColorStop(0.4, '#e8d0ff'); gem.addColorStop(1, 'rgba(180,140,255,0)');
        g.fillStyle = gem;
        g.beginPath(); g.arc(x + r * 0.18, y - r * 0.2, r * 0.16, 0, Math.PI * 2); g.fill();
      }
      if (id === 'trophy') {
        g.fillStyle = '#fffce0';
        g.beginPath();
        const s0 = r * 0.2;
        g.moveTo(x, y - s0);
        for (let i = 1; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const rads = i % 2 ? s0 * 0.42 : s0;
          g.lineTo(x + Math.cos(a) * rads, y + Math.sin(a) * rads);
        }
        g.closePath(); g.fill();
      }
      if (id === 'king') {
        g.strokeStyle = 'rgba(90,50,0,0.35)';
        g.lineWidth = Math.max(1.5, r * 0.035);
        g.beginPath(); g.arc(x, y, r * 0.68, 0, Math.PI * 2); g.stroke();
      }
      if (id !== 'ghost') gloss();
      if (id === 'ghost') {
        g.strokeStyle = 'rgba(180,230,255,0.35)';
        g.lineWidth = Math.max(1, r * 0.03);
        g.beginPath(); g.arc(x, y, r * 0.82, 0, Math.PI * 2); g.stroke();
      }
      g.restore();
    }
    function bakeSkin(id, color) {
      const key = (id || 'plain') + ':' + (color || '');
      let c = skinCache.get(key);
      if (c) return c;
      c = document.createElement('canvas'); c.width = 256; c.height = 256;
      paintSkin(c.getContext('2d'), 128, 128, 126, id, color);
      skinCache.set(key, c); return c;
    }

    const grid = document.getElementById('skinGrid');
    try { SKINS.forEach(id => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'skinBtn' + (chosenSkin === id ? ' on' : '');
      b.innerHTML = '<canvas width="46" height="46"></canvas><div>' + (NAMES[id] || id) + '</div>';
      try { paintSkin(b.querySelector('canvas').getContext('2d'), 23, 23, 21, id, '#4ad0ff'); } catch (_) {}
      b.onclick = () => {
        chosenSkin = chosenSkin === id ? '' : id;
        try { localStorage.setItem('blobarena_skin', chosenSkin); } catch (_) {}
        [...grid.children].forEach(x => x.classList.toggle('on', x === b && chosenSkin));
      };
      grid.appendChild(b);
    }); } catch (e) { console.warn('skins', e); }

    let W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    function resize() {
      W = innerWidth; H = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, cam && cam.z < 0.35 ? 1 : 1.5);
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();

    let WORLD = 10000, state = null, prevState = null, gotAt = 0, myId = null, running = false;
    let cam = { x: 5000, y: 5000, z: 1 };
    let face = { x: 1, y: 0 };
    let stick = { active: false, id: null, kx: 0, ky: 0 };
    let feeding = false;
    const JOY = 58;

    socket.on('state', s => { prevState = state; state = s; gotAt = performance.now(); WORLD = s.world || WORLD; });
    socket.on('joined', d => {
      myId = d.id; running = true; clearTimeout(window.__joinT);
      const btn = document.getElementById('playBtn');
      if (btn) { btn.textContent = 'PLAY'; btn.disabled = false; }
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('dead').classList.remove('show');
      document.getElementById('exitBtn').style.display = 'block';
    });
    socket.on('dead', d => {
      running = false;
      document.getElementById('deadMsg').textContent = (d && d.by ? d.by : 'Someone') + ' absorbed you.';
      document.getElementById('dead').classList.add('show');
      document.getElementById('exitBtn').style.display = 'none';
    });

    function doJoin() {
      const name = document.getElementById('nameInput').value.trim() || 'Unnamed';
      const btn = document.getElementById('playBtn');
      if (btn) { btn.textContent = 'STARTING…'; btn.disabled = true; }
      socket.emit('join', { name, skin: chosenSkin });
      clearTimeout(window.__joinT);
      window.__joinT = setTimeout(() => {
        if (!running) {
          if (btn) { btn.textContent = 'RETRY'; btn.disabled = false; }
          alert('Could not start — server did not answer. Hard-refresh and try again.');
        }
      }, 4000);
    }
    function play() {
      if (socket.connected) doJoin();
      else {
        joinPending = true;
        const btn = document.getElementById('playBtn');
        if (btn) btn.textContent = 'CONNECTING…';
        socket.connect();
        setTimeout(() => { if (!socket.connected) { joinPending = false; if (btn) { btn.textContent = 'RETRY'; btn.disabled = false; } alert('Cannot reach game server. Check Railway is Online.'); } }, 3500);
      }
    }
    document.getElementById('playBtn').onclick = play;
    window.__play = play;
    const lb = document.getElementById('leaderboard');
    const lbToggle = document.getElementById('lbToggle');
    if (lbToggle) lbToggle.addEventListener('pointerdown', e => {
      e.preventDefault();
      const closed = lb.classList.toggle('closed');
      lbToggle.textContent = closed ? '▼' : '▲';
    });
    document.getElementById('againBtn').onclick = play;
    document.getElementById('exitBtn').onclick = () => {
      socket.emit('exit'); running = false;
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('dead').classList.remove('show');
      document.getElementById('exitBtn').style.display = 'none';
    };
    document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') play(); });

    function sendInput(extra) {
      socket.emit('input', Object.assign({ x: face.x, y: face.y }, extra || {}));
    }
    setInterval(() => { if (running) sendInput(feeding ? { feed: true } : {}); }, 50);

    function worldToScreen(x, y) { return { x: (x - cam.x) * cam.z + W / 2, y: (y - cam.y) * cam.z + H / 2 }; }
    function mix(a, b, t) { return a + (b - a) * t; }
    function cellDraw(p, ci) {
      const c = p.cells[ci];
      if (!prevState || !p.id) return c;
      const op = (prevState.players || []).find(x => x.id === p.id);
      if (!op || !op.cells[ci]) return c;
      const o = op.cells[ci];
      const t = Math.min(1, (performance.now() - gotAt) / 45);
      return { x: mix(o.x, c.x, t), y: mix(o.y, c.y, t), r: mix(o.r, c.r, t), mass: c.mass };
    }
    function draw() {
      ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, H);
      if (!state) return;
      const me = (state.players || []).find(p => p.id === state.you);
      if (me && me.cells.length) {
        let m = 0, x = 0, y = 0;
        for (let i = 0; i < me.cells.length; i++) {
          const c = cellDraw(me, i);
          x += c.x * c.mass; y += c.y * c.mass; m += c.mass;
        }
        cam.x += (x / m - cam.x) * 0.28; cam.y += (y / m - cam.y) * 0.28;
        const desiredZ = Math.max(0.16, Math.min(1.15, 1.12 - Math.sqrt(m) * 0.018 - (me.cells.length - 1) * 0.035));
        cam.z += (desiredZ - cam.z) * 0.06;
        document.getElementById('scoreVal').textContent = (state.score || 0).toLocaleString();
        document.getElementById('massVal').textContent = 'Mass ' + (state.mass || 0);
      }
      const step = cam.z < 0.4 ? 180 : 60;
      ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.beginPath();
      const sx0 = cam.x - W / 2 / cam.z, sy0 = cam.y - H / 2 / cam.z, sx1 = cam.x + W / 2 / cam.z, sy1 = cam.y + H / 2 / cam.z;
      for (let x = Math.floor(sx0 / step) * step; x < sx1; x += step) { const s = worldToScreen(x, 0); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, H); }
      for (let y = Math.floor(sy0 / step) * step; y < sy1; y += step) { const s = worldToScreen(0, y); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); }
      ctx.stroke();
      const a = worldToScreen(0, 0), b = worldToScreen(WORLD, WORLD);
      ctx.strokeStyle = 'rgba(110,231,255,0.35)'; ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      const foods = state.foods || [];
      for (let i = 0; i < foods.length; i++) {
        const f = foods[i];
        const s = worldToScreen(f.x, f.y); const r = f.r * cam.z;
        if (s.x < -10 || s.y < -10 || s.x > W + 10 || s.y > H + 10) continue;
        ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(2.2, r), 0, Math.PI * 2); ctx.fillStyle = f.color; ctx.fill();
      }
      const layers = [];
      for (const v of state.viruses || []) layers.push({ kind:'v', mass:100, v });
      for (const p of state.players || []) p.cells.forEach((_, i) => { const c = cellDraw(p, i); layers.push({ kind:'c', mass:c.mass, c, p }); });
      layers.sort((x, y) => x.mass - y.mass);
      for (const item of layers) {
        if (item.kind === 'v') {
          const v = item.v, s = worldToScreen(v.x, v.y), r = v.r * cam.z;
          if (s.x < -r || s.y < -r || s.x > W + r || s.y > H + r) continue;
          ctx.beginPath();
          for (let i = 0; i < (v.spikes || 14); i++) {
            const ang = (i / (v.spikes || 14)) * Math.PI * 2;
            const rr = i % 2 === 0 ? r * 1.18 : r * 0.82;
            i === 0 ? ctx.moveTo(s.x + Math.cos(ang)*rr, s.y + Math.sin(ang)*rr) : ctx.lineTo(s.x + Math.cos(ang)*rr, s.y + Math.sin(ang)*rr);
          }
          ctx.closePath(); ctx.fillStyle = '#7cff6a'; ctx.fill(); ctx.strokeStyle = '#1f7a28'; ctx.stroke();
        } else {
          const c = item.c, p = item.p, s = worldToScreen(c.x, c.y), r = c.r * cam.z;
          if (s.x < -r || s.y < -r || s.x > W + r || s.y > H + r) continue;
          ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          if (r >= 12) {
            ctx.save(); ctx.clip();
            ctx.drawImage(bakeSkin(p.skin, p.color), s.x - r, s.y - r, r * 2, r * 2);
            ctx.restore();
          } else { ctx.fillStyle = p.color; ctx.fill(); }
          ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.lineWidth = Math.max(1.5, Math.min(6, r * 0.05));
          ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.stroke();
          if (p.name && r >= 7) {
            const fs = Math.min(22, r * 0.46);
            ctx.font = '800 ' + fs + 'px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(p.name, s.x, s.y);
            ctx.fillStyle = '#fff'; ctx.fillText(p.name, s.x, s.y);
          }
        }
      }
      document.getElementById('lbList').innerHTML = (state.lb || []).map(r =>
        '<li class="' + (r.me ? 'me' : '') + (r.i > 8 ? ' youRow' : '') + '"><span>' + r.i + '. ' + r.name + '</span><span>' + r.mass + '</span></li>'
      ).join('');
    }
    function loop() {
      try { draw(); } catch (err) { console.warn(err); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    socket.on('disconnect', () => { /* stay in game view; auto-reconnect */ });

    const joyWrap = document.getElementById('joyWrap');
    const joyKnob = document.getElementById('joyKnob');
    function joyCenter() { const r = joyWrap.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }
    function applyStick(cx, cy) {
      const c = joyCenter(); let dx = cx - c.x, dy = cy - c.y;
      const len = Math.hypot(dx, dy) || 1; const cap = Math.min(len, JOY);
      dx = dx / len * cap; dy = dy / len * cap;
      stick.kx = dx; stick.ky = dy; face.x = dx / JOY; face.y = dy / JOY;
      joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    }
    joyWrap.addEventListener('pointerdown', e => { stick.active = true; stick.id = e.pointerId; joyWrap.setPointerCapture(e.pointerId); applyStick(e.clientX, e.clientY); });
    joyWrap.addEventListener('pointermove', e => { if (stick.active && e.pointerId === stick.id) applyStick(e.clientX, e.clientY); });
    function endStick() { stick.active = false; stick.id = null; joyKnob.style.transform = ''; }
    joyWrap.addEventListener('pointerup', endStick);
    joyWrap.addEventListener('pointercancel', endStick);
    document.getElementById('splitBtn').addEventListener('pointerdown', e => { e.preventDefault(); sendInput({ split: true }); });
    document.getElementById('feedBtn').addEventListener('pointerdown', e => { e.preventDefault(); feeding = true; sendInput({ feed: true }); });
    document.getElementById('feedBtn').addEventListener('pointerup', () => { feeding = false; });
    addEventListener('mousemove', e => { if (!stick.active) { face.x = e.clientX - W/2; face.y = e.clientY - H/2; const l = Math.hypot(face.x, face.y) || 1; face.x /= l; face.y /= l; } });
    addEventListener('keydown', e => {
      const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
      if (e.code === 'Space') {
        if (typing) return;
        e.preventDefault();
        if (running) sendInput({ split: true });
      }
      if (e.code === 'KeyW' && !typing) feeding = true;
    });
    addEventListener('keyup', e => { if (e.code === 'KeyW') feeding = false; });
  })();
  </script>
</body>
